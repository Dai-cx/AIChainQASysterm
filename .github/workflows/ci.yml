name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Install Python dependencies
        run: UV_CACHE_DIR=/tmp/uv-cache uv sync --frozen --all-extras --dev

      - name: Python tests
        run: UV_CACHE_DIR=/tmp/uv-cache uv run pytest -q

      - name: Lightweight CLI smoke (init -> build-index -> demo -> doctor)
        env:
          AIKA_HOME: /tmp/aika-home
        run: |
          UV_CACHE_DIR=/tmp/uv-cache uv run aika init --sample --force
          UV_CACHE_DIR=/tmp/uv-cache uv run aika build-index
          UV_CACHE_DIR=/tmp/uv-cache uv run aika demo
          UV_CACHE_DIR=/tmp/uv-cache uv run aika doctor

      - name: Offline showcase smoke
        env:
          DATABASE_URL: ""
          LLM_API_KEY: ""
          EMBEDDING_MODEL: ""
        run: UV_CACHE_DIR=/tmp/uv-cache uv run aika showcase --offline --task-dir /tmp/aika-showcase-tasks

      - name: QA smoke evaluation
        run: UV_CACHE_DIR=/tmp/uv-cache uv run aika eval --suite qa --offline --limit 5 --report-dir /tmp/aika-eval --json

      - name: Agent smoke evaluation
        run: UV_CACHE_DIR=/tmp/uv-cache uv run aika eval --suite agent --offline --limit 1 --task-dir /tmp/aika-agent-tasks --json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix web ci

      - name: Build frontend
        run: npm --prefix web run build

      - name: Validate Docker Compose
        run: docker compose config

  # The project is developed on Windows but CI only ran on Ubuntu, which is why the
  # sqlite handle leak, the POSIX-only uv path and the hardcoded /tmp defaults all
  # shipped broken. A pytest-only Windows job keeps that class of bug out.
  test-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Install Python dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Python tests
        run: uv run pytest -q

      - name: Lightweight CLI smoke
        env:
          AIKA_HOME: ${{ runner.temp }}\aika-home
        run: |
          uv run aika init --sample --force
          uv run aika build-index
          uv run aika demo
          uv run aika doctor
